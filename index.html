<!doctype html>
<html lang="en" data-design="forma">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101115" />
    <!--route-meta-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      document.documentElement.dataset.design = new URLSearchParams(location.search).get('design') || document.documentElement.dataset.design || 'forma';
    </script>
    <style>html{background:#101115}html[data-design=forma]{background:#101115}html[data-design=signature]{background:#111310}body{margin:0}</style>

  </head>
  <body>
    <div id="root"></div>
    <noscript><style>
      .forma-art-controls,.forma-motion-toggle,.forma-footer-bottom button{display:none!important}

      .signature [data-sig-reveal] { opacity:1!important; translate:none!important; transform:none!important; }
      .sig-play-trigger,.sig-header-controls,.sig-floating-nav > button,.sig-year-selector,.sg-project-tabs,.sg-gallery-controls,.sg-project-actions > button,.sig-contact-email button { display:none!important; }
      .sig-chapter-panels > [hidden] { display:grid!important; margin-top:40px; }
      .sig-nav { display:flex!important; position:static!important; }
      .sig-kinetic-letter,.sig-reveal-word { opacity:1!important; transform:none!important; }
    </style></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
